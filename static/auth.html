<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 设备共享平台</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .card { max-width: 520px; margin: 40px auto; background: var(--bg-card); border:1px solid var(--border); padding:24px; border-radius:12px; box-shadow: var(--shadow); }
    .row { display:flex; gap:12px; margin-bottom:12px; }
    .row label { width:100px; color: var(--text-muted); display:flex; align-items:center; }
    .row input { flex:1; padding: 10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
    .btn { padding: 10px 16px; background: var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; }
    .btn.secondary { background:#0ea5e9; }
    .help { font-size: 13px; color: var(--text-muted); }
    .nav { text-align:center; margin-top:12px }
    .nav a { color:#2563eb }
    .msg { margin-top:10px; font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin-bottom:16px">手机号登录（开发模式验证码 000000）</h2>
    <div class="row">
      <label>手机号</label>
      <input id="phone" placeholder="请输入手机号" />
    </div>
    <div class="row">
      <label>验证码</label>
      <input id="code" placeholder="SMS 验证码" />
      <button class="btn secondary" id="send">发送验证码</button>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="login">登录</button>
    </div>
    <div class="help">登录成功后会在 Cookie 中写入刷新会话；使用时将 access_token 放到 Authorization 头。</div>
    <div class="nav"><a href="/">返回首页</a></div>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    function setToken(token) {
      localStorage.setItem('access_token', token);
    }
    function getToken() { return localStorage.getItem('access_token') || ''; }
    function setMsg(text){ document.getElementById('msg').textContent = text; }

    document.getElementById('send').addEventListener('click', async () => {
      const phone = document.getElementById('phone').value.trim();
      if (!phone) return setMsg('请输入手机号');
      const resp = await fetch('/api/v1/auth/sms/send', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone, scene:'login' }) });
      const data = await resp.json();
      setMsg('已发送（开发模式可直接使用 000000）');
    });

    document.getElementById('login').addEventListener('click', async () => {
      const phone = document.getElementById('phone').value.trim();
      const code = document.getElementById('code').value.trim();
      if (!phone || !code) return setMsg('请输入手机号和验证码');
      const resp = await fetch('/api/v1/auth/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone, code })});
      if (!resp.ok) { setMsg('登录失败'); return; }
      const data = await resp.json();
      setToken(data.access_token);
      setMsg('登录成功');
    });
  </script>
</body>
</html>
