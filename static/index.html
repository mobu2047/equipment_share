<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实验设备共享平台</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
    <div class="app-container">
        <!-- 左侧主要内容区域 -->
        <div class="main-content">
            <header class="header">
                <h1>🔬 株洲高新区实验设备共享平台智能助手</h1>
                <p class="subtitle">智能推荐，精准匹配您的实验需求</p>
            </header>

            <section class="location-section">
                <h2>📍 位置信息</h2>
                <div class="location-box">
                    <button id="locationBtn" class="location-btn">获取位置</button>
                    <div id="locationInfo" class="location-info">点击获取您的当前位置，以便推荐附近的设备</div>
                </div>
            </section>

            <section class="chat-section">
                <h2>💬 智能问答</h2>
                <div class="chat-box">
                    <textarea id="prompt" placeholder="请描述您的实验需求，例如：我需要进行蛋白质纯化实验，需要什么设备？"></textarea>
                    <button id="sendBtn" class="send-btn">
                        <span class="btn-text">发送查询</span>
                        <span class="btn-icon">→</span>
                    </button>
                </div>
                <div id="reply" class="reply"></div>
            </section>
        </div>

        <!-- 右侧推荐卡片区域 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🎯 设备推荐</h2>
                <div class="card-count">找到 <span id="cardCount">0</span> 个匹配设备</div>
            </div>
            
            <div class="cards-container" id="cardsContainer">
                <div class="cards-scroll">
                    <!-- 推荐卡片将动态插入这里 -->
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>请输入实验需求，获取设备推荐</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=4"></script>
</body>
</html>
